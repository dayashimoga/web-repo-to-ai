[package]
name = "web-repo-to-ai-exporters"
description = "Multi-format exporters for Markdown, JSON CDM, Claude XML, TXT, JSONL, and streaming ZIP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
web-repo-to-ai-core = { workspace = true }
web-repo-to-ai-cdm = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
blake3 = { workspace = true }
zip = { version = "9.6", default-features = false, features = ["deflate"] }
