[package]
name = "web-repo-to-ai-web-extractor"
description = "Static HTML parsing, readability extraction, and browser-worker fallback integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
web-repo-to-ai-core = { workspace = true }
web-repo-to-ai-cdm = { workspace = true }
web-repo-to-ai-url-security = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
serde = { workspace = true, features = ["derive"] }
reqwest = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["rt", "time"] }
flate2 = { workspace = true }
brotli = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
