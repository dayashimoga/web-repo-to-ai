[package]
name = "web-repo-to-ai-ocr-extractor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Isolated Tesseract OCR adapter, TSV stream parser, confidence scoring, and CDM mapping for web-repo-to-ai"

[lints]
workspace = true

[dependencies]
web-repo-to-ai-core = { workspace = true }
web-repo-to-ai-cdm = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time", "sync", "fs"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
web-repo-to-ai-exporters = { workspace = true }
