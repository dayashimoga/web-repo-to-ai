serde_yaml_ng = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
web-repo-to-ai-exporters = { workspace = true }
