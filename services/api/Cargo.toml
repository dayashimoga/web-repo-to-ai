[package]
name = "web-repo-to-ai-api"
description = "Axum HTTP and SSE API server for web-repo-to-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "web_repo_to_ai_api"
path = "src/lib.rs"

[[bin]]
name = "web-repo-to-ai-api"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
web-repo-to-ai-core = { workspace = true }
web-repo-to-ai-cdm = { workspace = true }
web-repo-to-ai-url-security = { workspace = true }
web-repo-to-ai-storage = { workspace = true }
web-repo-to-ai-job-engine = { workspace = true }
web-repo-to-ai-observability = { workspace = true }
web-repo-to-ai-exporters = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tokio-util = { workspace = true, features = ["io"] }
futures = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "timeout", "limit"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
http-body-util = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
