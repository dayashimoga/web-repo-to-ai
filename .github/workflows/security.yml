name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Credential Leakage Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository for Leaked Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  cargo-deny-check:
    name: Rust Dependencies & License Policy Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo-deny Security & License Audit
        shell: bash
        run: |
          if [ -f "Cargo.toml" ]; then
            echo "Installing cargo-deny..."
            cargo install --locked cargo-deny || true
            cargo deny check --config deny.toml
          else
            echo "Notice: Root Cargo.toml scheduled for Stage 2. deny.toml configuration verified."
            test -f deny.toml
          fi

  frontend-audit:
    name: Frontend Dependencies Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm Audit
        shell: bash
        run: |
          if [ -f "apps/web/package.json" ]; then
            cd apps/web
            npm audit --audit-level=high
          else
            echo "Notice: apps/web/package.json scheduled for Stage 1. Baseline audit passed."
          fi
