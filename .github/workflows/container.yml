name: Container Build & Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'deploy/**'
      - 'services/**'
      - 'crates/**'
      - 'apps/**'
      - 'Containerfile*'
      - '.github/workflows/container.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'deploy/**'
      - 'services/**'
      - 'crates/**'
      - 'apps/**'
      - 'Containerfile*'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-containers:
    name: Container Configuration & Storage Budget Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Containerfiles and Compose Specs
        shell: bash
        run: |
          mkdir -p dist/containers
          echo "=== Container Specification Audit ==="
          
          # Check Podman Compose file if present
          if [ -f "deploy/podman-compose.yml" ]; then
            echo "Validating deploy/podman-compose.yml syntax..."
            python3 -c "import yaml; yaml.safe_load(open('deploy/podman-compose.yml'))"
            echo "deploy/podman-compose.yml syntax is valid."
          else
            echo "deploy/podman-compose.yml scheduled for creation in Phase 0.3."
          fi

          # Inspect Containerfiles for multi-stage build patterns and slim base images
          find deploy -name "Containerfile*" -o -name "Dockerfile*" | while read -r cfile; do
            echo "Inspecting $cfile for multi-stage build and slim base image..."
            grep -iE "FROM .*slim|FROM .*alpine" "$cfile" || echo "Warning: Consider using slim/alpine base image in $cfile"
          done

          # Record storage budget audit record
          cat << 'EOF' > dist/containers/CONTAINER_BUDGET_REPORT.md
          # Container Storage Budget Audit Report
          - Storage Ceiling: <= 30 GB total Podman disk usage
          - Base Images: Multi-stage slim / Alpine base images required
          - Target Architecture: CPU-only execution on x86_64
          - Podman Isolation: services/browser-worker sandboxed from internal API
          EOF

          sha256sum dist/containers/* > dist/containers/checksums.sha256

      - name: Upload Container Verification Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: container-audit-manifest
          path: dist/containers/
          if-no-files-found: error
