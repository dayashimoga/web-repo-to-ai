<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>web-repo-to-ai</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand">
      <img src="../../public/icons/icon48.png" alt="Logo" />
      <h1>web-repo-to-ai</h1>
    </div>
    <div class="header-actions">
      <div id="statusDot" class="status-dot" title="Checking API status..."></div>
      <button id="btnOpenOptions" class="icon-btn" title="Open Settings" type="button">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Active Page Card -->
  <section class="card" id="pageSummaryCard">
    <div class="card-title">
      <span>Current Page</span>
      <span id="archetypeBadge" class="badge badge-web">Webpage</span>
    </div>
    <div id="tabTitle" class="tab-title">Loading tab...</div>
    <div id="tabUrl" class="tab-url">...</div>
  </section>

  <!-- Conversion Options Card -->
  <section class="card" id="conversionOptionsCard">
    <div class="control-row">
      <label class="control-label" for="formatSelect">Output Format</label>
      <select id="formatSelect">
        <option value="markdown">Markdown (.md)</option>
        <option value="txt">Plain Text (.txt)</option>
        <option value="json">Canonical Document (.json)</option>
        <option value="html">Clean HTML (.html)</option>
        <option value="jsonl">JSON Lines (.jsonl)</option>
        <option value="zip">ZIP Package (.zip)</option>
      </select>
    </div>

    <div class="control-row">
      <span class="control-label">Token Budget Preset</span>
      <div class="chips-container" id="budgetChips">
        <button class="chip" data-budget="8000" type="button">8K</button>
        <button class="chip active" data-budget="32000" type="button">32K</button>
        <button class="chip" data-budget="64000" type="button">64K</button>
        <button class="chip" data-budget="128000" type="button">128K</button>
        <button class="chip" data-budget="0" type="button">Max</button>
      </div>
    </div>
  </section>

  <!-- Progress Bar Container -->
  <div id="progressContainer" class="progress-container" style="display: none;">
    <div class="progress-bar-bg">
      <div id="progressBar" class="progress-bar" style="width: 0%;"></div>
    </div>
    <div id="progressPhaseText" class="progress-phase-text">Starting conversion...</div>
  </div>

  <!-- Primary Action Section -->
  <div id="actionSection">
    <button id="btnConvert" class="btn-convert" type="button">
      <span class="spinner" id="spinner"></span>
      <span id="btnConvertText">Convert Current Tab</span>
    </button>
    <div id="statusMessage" class="status-message"></div>
  </div>

  <!-- Completed Result View -->
  <section id="resultContainer" class="result-card" style="display: none;">
    <div class="result-header">
      <span class="result-success-icon">✓</span>
      <h3>Conversion Complete</h3>
    </div>
    <div class="result-metrics">
      <div class="metric-item">
        <span class="metric-val" id="resTokens">0</span>
        <span class="metric-lbl">Tokens</span>
      </div>
      <div class="metric-item">
        <span class="metric-val" id="resChars">0 B</span>
        <span class="metric-lbl">Size</span>
      </div>
      <div class="metric-item">
        <span class="metric-val" id="resFormat">MD</span>
        <span class="metric-lbl">Format</span>
      </div>
    </div>
    <div class="result-actions">
      <button id="btnCopyResult" class="btn-action" type="button">
        📋 Copy Content
      </button>
      <button id="btnDownloadResult" class="btn-action" type="button">
        ⬇️ Download
      </button>
      <button id="btnOpenInWorkspace" class="btn-action btn-highlight" type="button">
        🔗 Open Web UI
      </button>
    </div>
    <button id="btnResetConversion" class="btn-link" type="button">
      Convert another
    </button>
  </section>

  <!-- Footer Links -->
  <div class="footer-links" id="footerLinks">
    <a href="#" id="linkOpenWorkspace">Open Web UI</a>
    <span id="apiVersion" style="color: var(--text-muted); font-size: 10px;">v0.1.0</span>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
