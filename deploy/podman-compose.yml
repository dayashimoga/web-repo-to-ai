version: '3.8'

networks:
  internal_net:
    driver: bridge
  browser_net:
    driver: bridge
    internal: false

volumes:
  postgres_data:
    driver: local
  artifact_data:
    driver: local

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: web-repo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webrepotodev}
      POSTGRES_USER: ${POSTGRES_USER:-webrepouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webrepouser} -d ${POSTGRES_DB:-webrepotodev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  api:
    build:
      context: ..
      dockerfile: deploy/Containerfile.api
    container_name: web-repo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-webrepouser}:${POSTGRES_PASSWORD:-devpassword123}@postgres:5432/${POSTGRES_DB:-webrepotodev}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /var/lib/web-repo-to-ai/artifacts
      API_PORT: "8080"
      RUST_LOG: "info,web_repo_to_ai=debug"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - artifact_data:/var/lib/web-repo-to-ai/artifacts
    networks:
      - internal_net

  worker:
    build:
      context: ..
      dockerfile: deploy/Containerfile.worker
    container_name: web-repo-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-webrepouser}:${POSTGRES_PASSWORD:-devpassword123}@postgres:5432/${POSTGRES_DB:-webrepotodev}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /var/lib/web-repo-to-ai/artifacts
      BROWSER_WORKER_URL: http://browser-worker:3000
      RUST_LOG: "info,web_repo_to_ai=debug"
    volumes:
      - artifact_data:/var/lib/web-repo-to-ai/artifacts
    networks:
      - internal_net
      - browser_net

  browser-worker:
    build:
      context: ..
      dockerfile: deploy/Containerfile.browser-worker
    container_name: web-repo-browser-worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: "3000"
      NODE_ENV: production
    networks:
      - browser_net

  web:
    build:
      context: ..
      dockerfile: deploy/Containerfile.web
    container_name: web-repo-web
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: http://api:8080/api/v1
      PORT: "5173"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - internal_net
